name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* or signed-macos-v* tag'
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos:
    name: macOS (development archive)
    if: ${{ !startsWith(github.event.inputs.tag || github.ref_name, 'signed-macos-v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build app bundle
        run: scripts/bundle.sh
      - name: Package
        run: |
          arch="$(uname -m)"
          base="keyjitsu-${RELEASE_TAG}-macos-${arch}"
          ditto -c -k --keepParent target/release/Keyjitsu.app "${base}.zip"
          cp target/release/keyjitsu "${base}-cli"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            keyjitsu-*-macos-*.zip
            keyjitsu-*-macos-*-cli

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          base="keyjitsu-${RELEASE_TAG#signed-macos-}-linux-x86_64"
          mkdir "${base}"
          cp target/release/keyjitsu "${base}/"
          cp README.md LICENSE "${base}/"
          tar -czf "${base}.tar.gz" "${base}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: keyjitsu-*-linux-x86_64.tar.gz

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG -replace '^signed-macos-', ''
          $base = "keyjitsu-$tag-windows-x86_64"
          New-Item -ItemType Directory -Path $base | Out-Null
          Copy-Item target/release/keyjitsu.exe "$base/keyjitsu.exe"
          Copy-Item README.md, LICENSE -Destination "$base/"
          Compress-Archive -Path "$base/*" -DestinationPath "$base.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: keyjitsu-*-windows-x86_64.zip

  publish:
    name: Publish release assets
    needs: [macos, linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' && (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && startsWith(github.event.inputs.tag || github.ref_name, 'signed-macos-v'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          if [[ "$RELEASE_TAG" == signed-macos-v* ]]; then
            sha256sum * > SHA256SUMS-linux-windows.txt
            cat SHA256SUMS-linux-windows.txt
          else
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi
      - name: Attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RELEASE_TAG" == signed-macos-v* ]]; then
            # A signed macOS release must already exist. Do not replace its assets.
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -q -- '-macos-arm64.dmg$'
            gh release upload "$RELEASE_TAG" dist/* --clobber
            version="${RELEASE_TAG#signed-macos-v}"
            version="${version%-*}"
            notes="$RUNNER_TEMP/keyjitsu-release-notes.md"
            gh release view "$RELEASE_TAG" --json body --jq .body > "$notes"
            if ! grep -q '^### Linux and Windows' "$notes"; then
              printf '\n### Linux and Windows\n\nExperimental x86_64 builds from the same source commit. Extract the Linux TAR.GZ or Windows ZIP and run Keyjitsu. USB access and firmware flashing still need hardware validation. See SHA256SUMS-linux-windows.txt for checksums.\n' >> "$notes"
            fi
            gh release edit "$RELEASE_TAG" --title "Keyjitsu $version" --notes-file "$notes"
            exit 0
          fi
          release_flags=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --verify-tag --title "keyjitsu ${RELEASE_TAG}" --notes-file CHANGELOG.md "${release_flags[@]}"
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            gh release edit "${RELEASE_TAG}" --prerelease
          fi
          gh release upload "${RELEASE_TAG}" dist/* --clobber
