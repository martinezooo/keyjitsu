name: CI

on:
  push:
    branches: [master, 'audit/**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prepare stable Rust
        run: |
          rustup default stable
          rustup component add clippy rustfmt
      - name: Install Linux HID dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Format
        run: set -o pipefail; cargo fmt --all -- --check 2>&1 | tee fmt.log
      - name: Build
        run: set -o pipefail; cargo build --locked 2>&1 | tee build.log
      - name: Clippy (warnings are errors)
        run: set -o pipefail; cargo clippy --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
      - name: Test
        run: set -o pipefail; cargo test --locked 2>&1 | tee test.log
      - name: Upload CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ runner.os }}
          path: |
            fmt.log
            build.log
            clippy.log
            test.log
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
